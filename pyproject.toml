[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudlens"
version = "0.1.0"
description = "Multi-cloud resource management and cost optimization framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CloudLens contributors" }]

dependencies = [
    "boto3>=1.34",
    "pandas>=2.1",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "typer>=0.9",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
cloudlens = "cloudlens.cli:app"

[tool.setuptools.packages.find]
include = ["cloudlens*"]

[tool.setuptools.package-data]
cloudlens = ["data/*.json"]
